# Explicit binding: VI, FI, argument lists, BA, SI. refgram logic/explicit_binding.md.

- text: "a mi duna vo mo vei meon"
  source: refgram logic/explicit_binding.md
  formula: |
    mo_1(c,e) := mo(c,e)
    meon_1(c,e) := meon(c,e)
    duna_1(c,e,a,o) := duna(c,e,a,o) ∧ mo_1(c,o) ∧ meon_1(c,a)
    duna_1^w(c,e) := ∃a ∃o. duna_1(c,e,a,o)
    mi_1(c,e) := mi(c,e) ∧ duna_1^w(c,e)
    mi_1^w(c) := ∃e. mi_1(c,e)
    assert mi_1^w(c)

- text: "a duna ve mi fo mo fa meon"
  source: refgram logic/explicit_binding.md
  note: FI binds on the same verb, final vei elided
  formula: |
    mi_1(c,e) := mi(c,e)
    mo_1(c,e) := mo(c,e)
    meon_1(c,e) := meon(c,e)
    duna_1(c,e,a,o) := duna(c,e,a,o) ∧ mi_1(c,e) ∧ mo_1(c,o) ∧ meon_1(c,a)
    duna_1^w(c) := ∃e ∃a ∃o. duna_1(c,e,a,o)
    assert duna_1^w(c)

- text: "a duna ve mi fahu mo"
  note: relative FI, next place after E
  formula: |
    mi_1(c,e) := mi(c,e)
    mo_1(c,e) := mo(c,e)
    duna_1(c,e,a,o) := duna(c,e,a,o) ∧ mi_1(c,e) ∧ mo_1(c,a)
    duna_1^w(c) := ∃e ∃a ∃o. duna_1(c,e,a,o)
    assert duna_1^w(c)

- text: "a mi dona va ke be mian etiansa ke"
  source: refgram logic/explicit_binding.md
  note: argument list; the bind predicate va_1 takes the listed variable as its parameter
  formula: |
    va_1(c,x_ke) := mian_1^w(c) where
        ke_1(c,e) := (e = x_ke)
        etiansa_1(c,e,a) := etiansa(c,e,a) ∧ ke_1(c,a)
        etiansa_1^w(c,e) := ∃a. etiansa_1(c,e,a)
        mian_1(c,e) := mian(c,e) ∧ etiansa_1^w(c,e)
        mian_1^w(c) := ∃e. mian_1(c,e)
    dona_1(c,e,a) := dona(c,e,a) ∧ va_1(c,a)
    dona_1^w(c,e) := ∃a. dona_1(c,e,a)
    mi_1(c,e) := mi(c,e) ∧ dona_1^w(c,e)
    mi_1^w(c) := ∃e. mi_1(c,e)
    assert mi_1^w(c)

- text: "a mi dona va be mian etiansa ba"
  source: refgram logic/explicit_binding.md
  note: inline ba appends a parameter to the empty argument list
  formula: |
    va_1(c,x_ba) := mian_1^w(c) where
        ba_1(c,e) := (e = x_ba)
        etiansa_1(c,e,a) := etiansa(c,e,a) ∧ ba_1(c,a)
        etiansa_1^w(c,e) := ∃a. etiansa_1(c,e,a)
        mian_1(c,e) := mian(c,e) ∧ etiansa_1^w(c,e)
        mian_1^w(c) := ∃e. mian_1(c,e)
    dona_1(c,e,a) := dona(c,e,a) ∧ va_1(c,a)
    dona_1^w(c,e) := ∃a. dona_1(c,e,a)
    mi_1(c,e) := mi(c,e) ∧ dona_1^w(c,e)
    mi_1^w(c) := ∃e. mi_1(c,e)
    assert mi_1^w(c)

- text: "a mi katmi va sae tuli mo"
  source: refgram logic/explicit_binding.md
  note: sharing a predicate place; sae exposes A then E, the consumer takes A
  formula: |
    mo_1(c,e) := mo(c,e)
    tuli_1(c,e,A) := tuli(c,e,A) ∧ mo_1(c,e)
    tuli_1^w(c,A) := ∃e. tuli_1(c,e,A)
    katmi_1(c,e,A) := katmi(c,e,A) ∧ tuli_1^w(c,A)
    katmi_1^w(c,e) := ∃A. katmi_1(c,e,A)
    mi_1(c,e) := mi(c,e) ∧ katmi_1^w(c,e)
    mi_1^w(c) := ∃e. mi_1(c,e)
    assert mi_1^w(c)

- text: "a mi katmi via sae tuli mo"
  source: refgram logic/explicit_binding.md
  note: defining a 0-ary predicate place by equivalence
  formula: |
    mo_1(c,e) := mo(c,e)
    tuli_1(c,e,A) := tuli(c,e,A) ∧ mo_1(c,e)
    tuli_1^w(c) := ∃e ∃A. tuli_1(c,e,A)
    katmi_1(c,e,A) := katmi(c,e,A) ∧ A ≡ tuli_1^w
    katmi_1^w(c,e) := ∃A. katmi_1(c,e,A)
    mi_1(c,e) := mi(c,e) ∧ katmi_1^w(c,e)
    mi_1^w(c) := ∃e. mi_1(c,e)
    assert mi_1^w(c)

- text: "a mi duna vao mo meon"
  source: refgram logic/explicit_binding.md
  note: multi-place VI, one predicate per vowel
  formula: |
    mo_1(c,e) := mo(c,e)
    meon_1(c,e) := meon(c,e)
    duna_1(c,e,a,o) := duna(c,e,a,o) ∧ mo_1(c,a) ∧ meon_1(c,o)
    duna_1^w(c,e) := ∃a ∃o. duna_1(c,e,a,o)
    mi_1(c,e) := mi(c,e) ∧ duna_1^w(c,e)
    mi_1^w(c) := ∃e. mi_1(c,e)
    assert mi_1^w(c)

- text: "a mi kelo vaio za ubob sae coriu vihon"
  source: refgram logic/explicit_binding.md
  note: multi-place VI with a sharing vowel and an equivalence vowel; za names a borrowing
  formula: |
    za-ubob_1(c,e,a) := za-ubob(c,e,a)
    za-ubob_1^w(c,e) := ∃a. za-ubob_1(c,e,a)
    vihon_1(c,e) := vihon(c,e)
    coriu_1(c,e,a) := coriu(c,e,a) ∧ vihon_1(c,e)
    coriu_1^w(c) := ∃e ∃a. coriu_1(c,e,a)
    kelo_1(c,e,a,O) := kelo(c,e,a,O) ∧ za-ubob_1^w(c,a) ∧ O ≡ coriu_1^w
    kelo_1^w(c,e) := ∃a ∃O. kelo_1(c,e,a,O)
    mi_1(c,e) := mi(c,e) ∧ kelo_1^w(c,e)
    mi_1^w(c) := ∃e. mi_1(c,e)
    assert mi_1^w(c)

- text: "a mian se etiansa bjan"
  source: refgram logic/explicit_binding.md
  note: SI selects E for the right bind and the exposed place
  formula: |
    bjan_1(c,e,a) := bjan(c,e,a)
    bjan_1^w(c,e) := ∃a. bjan_1(c,e,a)
    etiansa_1(c,e,a) := etiansa(c,e,a) ∧ bjan_1^w(c,e)
    etiansa_1^w(c,e) := ∃a. etiansa_1(c,e,a)
    mian_1(c,e) := mian(c,e) ∧ etiansa_1^w(c,e)
    mian_1^w(c) := ∃e. mian_1(c,e)
    assert mian_1^w(c)

- text: "a meon sae etiansa mian"
  source: refgram logic/explicit_binding.md
  note: sae exposes A to the consumer and binds E on the right
  formula: |
    mian_1(c,e) := mian(c,e)
    etiansa_1(c,e,a) := etiansa(c,e,a) ∧ mian_1(c,e)
    etiansa_1^w(c,a) := ∃e. etiansa_1(c,e,a)
    meon_1(c,e) := meon(c,e) ∧ etiansa_1^w(c,e)
    meon_1^w(c) := ∃e. meon_1(c,e)
    assert meon_1^w(c)

- text: "a mi jvin vi mo jvin"
  note: vi binds no place, a 0-ary conjunct; instances are numbered in text order
  formula: |
    jvin_2(c,e) := jvin(c,e)
    mo_1(c,e) := mo(c,e) ∧ jvin_2(c,e)
    mo_1^w(c) := ∃e. mo_1(c,e)
    jvin_1(c,e) := jvin(c,e) ∧ mo_1^w(c)
    mi_1(c,e) := mi(c,e) ∧ jvin_1(c,e)
    mi_1^w(c) := ∃e. mi_1(c,e)
    assert mi_1^w(c)

- text: "a mi dona bi va mian"
  note: bi before VI negates the bind conjunct
  formula: |
    mian_1(c,e) := mian(c,e)
    dona_1(c,e,a) := dona(c,e,a) ∧ ¬mian_1(c,a)
    dona_1^w(c,e) := ∃a. dona_1(c,e,a)
    mi_1(c,e) := mi(c,e) ∧ dona_1^w(c,e)
    mi_1^w(c) := ∃e. mi_1(c,e)
    assert mi_1^w(c)

- text: "a mi pe ke be dona ke pei tcu mian"
  note: bracket with an argument list, then chaining into the bracket's single place
  formula: |
    pe-args_1(c,x_ke) := dona_1^w(c) where
        ke_1(c,e) := (e = x_ke)
        dona_1(c,e,a) := dona(c,e,a) ∧ ke_1(c,a)
        dona_1^w(c) := ∃e ∃a. dona_1(c,e,a)
    mian_1(c,e) := mian(c,e)
    tcu_1(c,e,A) := tcu(c,e,A) ∧ A ≡ mian_1
    tcu_1^w(c,e) := ∃A. tcu_1(c,e,A)
    pe_1(c,e) := pe-args_1(c,e) ∧ tcu_1^w(c,e)
    mi_1(c,e) := mi(c,e) ∧ pe_1(c,e)
    mi_1^w(c) := ∃e. mi_1(c,e)
    assert mi_1^w(c)
