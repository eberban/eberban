# Chaining and wrapping. refgram logic/chaining.md; each example asserted as a sentence.
# Place lists come from the dictionary: bjan has an A place ("according to"), which the refgram
# examples leave out.

- text: "a mian bjan"
  source: refgram logic/chaining.md
  formula: |
    bjan_1(c,e,a) := bjan(c,e,a)
    bjan_1^w(c,e) := ∃a. bjan_1(c,e,a)
    mian_1(c,e) := mian(c,e) ∧ bjan_1^w(c,e)
    mian_1^w(c) := ∃e. mian_1(c,e)
    assert mian_1^w(c)

- text: "a mian etiansa"
  source: refgram logic/chaining.md
  note: arity mismatch resolution hides A
  formula: |
    etiansa_1(c,e,a) := etiansa(c,e,a)
    etiansa_1^w(c,e) := ∃a. etiansa_1(c,e,a)
    mian_1(c,e) := mian(c,e) ∧ etiansa_1^w(c,e)
    mian_1^w(c) := ∃e. mian_1(c,e)
    assert mian_1^w(c)

- text: "a tce mian"
  source: refgram logic/chaining.md
  note: predicate place bound by equivalence, 1-ary
  formula: |
    mian_1(c,e) := mian(c,e)
    tce_1(c,e,A) := tce(c,e,A) ∧ A ≡ mian_1
    tce_1^w(c) := ∃e ∃A. tce_1(c,e,A)
    assert tce_1^w(c)

- text: "a gali mian"
  source: refgram logic/chaining.md
  note: 0-ary predicate place, the right chain is wrapped to a proposition
  formula: |
    mian_1(c,e) := mian(c,e)
    mian_1^w(c) := ∃e. mian_1(c,e)
    gali_1(c,e,A) := gali(c,e,A) ∧ A ≡ mian_1^w
    gali_1^w(c) := ∃e ∃A. gali_1(c,e,A)
    assert gali_1^w(c)

- text: "a mi dona tcu mian"
  source: refgram logic/chaining.md
  formula: |
    mian_1(c,e) := mian(c,e)
    tcu_1(c,e,A) := tcu(c,e,A) ∧ A ≡ mian_1
    tcu_1^w(c,e) := ∃A. tcu_1(c,e,A)
    dona_1(c,e,a) := dona(c,e,a) ∧ tcu_1^w(c,a)
    dona_1^w(c,e) := ∃a. dona_1(c,e,a)
    mi_1(c,e) := mi(c,e) ∧ dona_1^w(c,e)
    mi_1^w(c) := ∃e. mi_1(c,e)
    assert mi_1^w(c)

- text: "a mian pe jvin bure pei meon"
  note: brackets group a chain; the bracket has the chain's places and meon chains to it
  formula: |
    bure_1(c,e,a) := bure(c,e,a)
    bure_1^w(c,e) := ∃a. bure_1(c,e,a)
    jvin_1(c,e) := jvin(c,e) ∧ bure_1^w(c,e)
    meon_1(c,e) := meon(c,e)
    pe_1(c,e) := jvin_1(c,e) ∧ meon_1(c,e)
    mian_1(c,e) := mian(c,e) ∧ pe_1(c,e)
    mian_1^w(c) := ∃e. mian_1(c,e)
    assert mian_1^w(c)
