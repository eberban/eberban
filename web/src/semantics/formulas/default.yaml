# Default arguments. refgram logic/default.md. Defaults print only when set with oiX, or for
# every hidden unbound atom place with all_defaults.

- text: "oia espuackuil fsan a mi dona espuackuil"
  source: refgram logic/default.md
  formula: |
    fsan_1(c,e) := fsan(c,e)
    zoia-espuackuil(c,e) := fsan_1(c,e)
    default espuackuil.A

    espuackuil_1(c,e,a) := espuackuil(c,e,a)
    zoia-espuackuil_1(c,e) := zoia-espuackuil(c,e)
    espuackuil_1^w(c,e) := ∃a. espuackuil_1(c,e,a) ∧ zoia-espuackuil_1(c,a)
    dona_1(c,e,a) := dona(c,e,a) ∧ espuackuil_1^w(c,a)
    dona_1^w(c,e) := ∃a. dona_1(c,e,a)
    mi_1(c,e) := mi(c,e) ∧ dona_1^w(c,e)
    mi_1^w(c) := ∃e. mi_1(c,e)
    assert mi_1^w(c)

- text: "oia espuackuil fsan a mi dona espuackuil va mian"
  source: refgram logic/default.md
  note: an explicit bind removes the default
  formula: |
    fsan_1(c,e) := fsan(c,e)
    zoia-espuackuil(c,e) := fsan_1(c,e)
    default espuackuil.A

    mian_1(c,e) := mian(c,e)
    espuackuil_1(c,e,a) := espuackuil(c,e,a) ∧ mian_1(c,a)
    espuackuil_1^w(c,e) := ∃a. espuackuil_1(c,e,a)
    dona_1(c,e,a) := dona(c,e,a) ∧ espuackuil_1^w(c,a)
    dona_1^w(c,e) := ∃a. dona_1(c,e,a)
    mi_1(c,e) := mi(c,e) ∧ dona_1^w(c,e)
    mi_1^w(c) := ∃e. mi_1(c,e)
    assert mi_1^w(c)

- text: "a mi dona espuackuil"
  source: refgram logic/default.md
  note: the refgram example with all default binds written; dona's A is bound by chaining, so
    unlike the refgram text it gets no default
  all_defaults: true
  formula: |
    espuackuil_1(c,e,a) := espuackuil(c,e,a)
    zoia-espuackuil_1(c,e) := zoia-espuackuil(c,e)
    espuackuil_1^w(c,e) := ∃a. espuackuil_1(c,e,a) ∧ zoia-espuackuil_1(c,a)
    dona_1(c,e,a) := dona(c,e,a) ∧ espuackuil_1^w(c,a)
    dona_1^w(c,e) := ∃a. dona_1(c,e,a)
    mi_1(c,e) := mi(c,e) ∧ dona_1^w(c,e)
    mi_1^w(c) := ∃e. mi_1(c,e)
    assert mi_1^w(c)

- text: "oia espuackuil fsan on ga espuackuil"
  source: refgram logic/default.md
  note: a definition re-exporting the place inherits its default
  formula: |
    fsan_1(c,e) := fsan(c,e)
    zoia-espuackuil(c,e) := fsan_1(c,e)
    default espuackuil.A

    espuackuil_1(c,e,a) := espuackuil(c,e,a)
    ga(c,e,a) := espuackuil_1(c,e,a)
    define ga
    default ga.A

- text: "a mi dona zoia espuackuil"
  source: refgram logic/default.md
  note: zoia names the default predicate itself
  formula: |
    zoia-espuackuil_1(c,e) := zoia-espuackuil(c,e)
    dona_1(c,e,a) := dona(c,e,a) ∧ zoia-espuackuil_1(c,a)
    dona_1^w(c,e) := ∃a. dona_1(c,e,a)
    mi_1(c,e) := mi(c,e) ∧ dona_1^w(c,e)
    mi_1^w(c) := ∃e. mi_1(c,e)
    assert mi_1^w(c)
