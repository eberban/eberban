# Compounds: e/en/er prefixes, nesting, shorthands. refgram grammar/compounds.md.
# Transitivity comes from the last component (se/sa/sai override).

- text: "e ber ban"
  shape: "(a): e(ber ban)-E"
  source: refgram grammar/compounds.md

- text: "eberban"
  shape: "(a): e(ber ban)-E"
  note: spaces inside a compound are optional

- text: "a eberban"
  shape: "a: e(ber ban)-E"

- text: "aeberban"
  shape: "ae: ber-E > ban-E"
  note: without the space, ae is an A particle and berban splits into two roots

- text: "e uinglic ban"
  shape: "(a): e(uinglic ban)-E"
  source: refgram grammar/compounds.md

- text: "e gzon sa"
  shape: "(a): e(gzon sa)-A"
  source: refgram grammar/compounds.md

- text: "e tian sai"
  shape: "(a): e(tian sai)=A"

- text: "e dona se"
  shape: "(a): e(dona se)-E"

- text: "en skal co sa"
  shape: "(a): en(skal co sa)-A"
  source: dictionary vjano

- text: "er mian bjan jmu e"
  shape: "(a): er(mian bjan jmu)=A"
  note: jmu is CCV, so the compound chains by equivalence

- text: "e e ber ban ban"
  shape: "(a): e(e(ber ban) ban)-E"
  source: refgram grammar/compounds.md

- text: "ei ber ban ban"
  shape: "(a): e(i(ber ban) ban)-E"
  note: attached shorthand, the parser records the inner prefix as i
  source: refgram grammar/compounds.md

- text: "ein mian bjan jmu meon"
  shape: "(a): e(in(mian bjan jmu) meon)-E"

- text: "ene mian bjan jmu meon"
  shape: "(a): en(e(mian bjan) jmu meon)-E"

- text: "e umia ban"
  shape: "(a): e(umia ban)-E"
  note: borrowing as a component

- text: "e ke ban"
  shape: "(a): e(ke ban)-E"
  note: particle as a component

- text: "e i ber ban ban"
  error: "must be attached"

- text: "e ber"
  error: "incomplete"

- text: "er e"
  error: "Empty compounds"

- text: "er mian e"
  warning: "size 1"

- text: "er mian bjan e"
  warning: "fixed-size compound"

- text: "e-ber ban"
  warning: "after the e/EN/ER prefix"

- text: "e-n mian bjan jmu"
  warning: "inside the EN/ER prefix"

- text: "eni ber ban ban meon"
  warning: "instead of ni"
  note: en followed by an attached i-compound should be written ene
