# Word-level edge cases: letters, hyphens, pairs, triplets, spaces, hesitation.
# refgram morphonology/morphology.md and phonology.md, grammar E_/W_ rules.

- text: "a mmiiaan"
  shape: "a: mian-E"
  note: repeated letters are one letter

- text: "A MIAN"
  shape: "a: mian-E"
  note: case is ignored

- text: "a mi-an"
  shape: "a: mian-E"
  no_warning: true
  note: hyphen at a syllable boundary is allowed

- text: "a mia-n"
  warning: "before final sonorant"

- text: "a m-ian"
  warning: "after an initial pair or consonant"

- text: "a -mian"
  warning: "start of a word"

- text: "a mian-"
  warning: "end of a word"

- text: "a t-cuin"
  warning: "inside an initial pair"

- text: "a tc-uin"
  warning: "after an initial pair or consonant"

- text: "a glan"
  error: "medial pair, not a valid root start"
  note: consonant + sonorant pairs are medial-only since grammar 0.66; older texts still use such roots

- text: "a bdan"
  error: "medial pair, not a valid root start"

- text: "a pban"
  error: "voiceness"

- text: "a scan"
  error: "sibilants"

- text: "a qat"
  error: "not an Eberban letter"

- text: "a mih"
  error: "h can only appear between vowels"

- text: "a hmi"
  error: "h can only appear between vowels"
  note: word-initial h

- text: "a miha"
  shape: "a: miha-E"
  note: h between vowels inside a particle

- text: "a mi-i"
  error: "same vowel"

- text: "a mianetiansa"
  error: "SI must be followed by a verb"
  note: segments as "miane tian sa", the trailing SI has no verb

- text: "a mi n mo"
  shape: "a: mi-E > mo-E"
  note: hesitation is dropped

- text: "a mi nn n mo"
  shape: "a: mi-E > mo-E"

- text: "a tapksa"
  shape: "a: tapksa-A"
  note: medial + initial triplet (pk medial, ks initial)

- text: "a paksa"
  error: "at least one"
  note: ks is an initial pair, so paksa splits into pa + ksa, and pa is the PA particle

- text: "a pastra"
  shape: "a: pastra-A"
  note: onset + liquid triplet

- text: "a paktca"
  shape: "a: paktca-A"

- text: "a pamla"
  shape: "a: pamla-A"
  note: ml is a medial pair, no triplet involved

- text: "a tapmla"
  error: "Y is m"
  note: pm is a medial pair but a triplet with m in the middle is rejected

- text: "a pakstra"
  error: "Up to 3 consonants"

- text: "a mibjan"
  shape: "a: mi-E > bjan-E"
  note: particle then root without a space

- text: "a mianse bjan"
  shape: "a: mian-E > se bjan(E)-E"
  note: root then particle without a space

- text: "a donanu"
  shape: "a: donanu-A"
  note: a sonorant-initial particle merges into the previous root without a space

- text: "a mian."
  shape: "a: mian-E"

- text: "ahu mi"
  shape: "ahu: mi-E"
  note: any a-initial particle is a sentence starter of family A
