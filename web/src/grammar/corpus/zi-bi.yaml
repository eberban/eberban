# ZI transformations and BI wide negation. refgram logic/transformations.md.

- text: "mi zi bure meon"
  shape: "(a): mi-E > zi bure-A > meon-E"
  note: short negation stays on the verb
  source: refgram logic/transformations.md

- text: "mi bi bure meon"
  shape: "(a): mi-E > bi (bure-A > meon-E)"
  note: wide negation covers the rest of the chain
  source: refgram logic/transformations.md

- text: "bi bure meon"
  shape: "(a): bi (bure-A > meon-E)"

- text: "bi bi mian"
  shape: "(a): bi (bi (mian-E))"
  note: nested wide negations, double negation; the tree keeps both bi in an array

- text: "a mi dona ze mian"
  shape: "a: mi-E > dona-A > ze mian-E"
  source: refgram logic/transformations.md

- text: "a se ze etiansa dona mi"
  shape: "a: se ze e(tian sa)(E)-E > dona-A > mi-E"
  note: SI before an anaphoric compound

- text: "a mi dona zei ban"
  shape: "a: mi-E > dona-A > zei ban-E"

- text: "a zeu mian"
  shape: "a: zeu mian-E"

- text: "bo ke mian bjan"
  shape: "(a): bo ke-E > mian-E > bjan-E"
  note: forethought assignment of a KI

- text: "boi ge mian"
  note: forethought assignment of a GI, structure only

- text: "bo mian bjan"
  shape: "(a): bo mian-E > bjan-E"
  note: bo before a root

- text: "bo i.alis mian"
  shape: "(a): bo i(alis)-E > mian-E"
  note: bo before a freeform variable

- text: "mi zue katmi jvin"
  shape: "(a): mi-E > zue katmi=A > jvin-E"
  note: zue keeps the predicate A place, now 1-ary
  source: refgram logic/transformations.md

- text: "mi zue sea gali jvin"
  shape: "(a): mi-E > zue sea gali(EA)-A > jvin-E"
  note: SI after a ZI selects the promoted places

- text: "zi zi mian"
  shape: "(a): zi zi mian-E"
  note: stacked ZI

- text: "za umia uentropi be"
  shape: "(a): za u(mia entropi)-E"
  note: za is intransitive whatever the borrowing ends with

- text: "zai mian"
  shape: "(a): zai mian-E"

- text: "zai dona"
  shape: "(a): zai dona-E"
  note: zai is 1-ary, the name itself, whatever the prefixed word

- text: "mi zu ke mo"
  shape: "(a): mi-E > zu ke-A > mo-E"
  note: zu instantiates with transitive behavior (refgram transformations.md)

- text: "mi zui ke"
  shape: "(a): mi-E > zui ke-E"
  note: zui instantiates with intransitive behavior (refgram transformations.md)

- text: "zi pe mian bjan pei"
  shape: "(a): zi pe(mian-E > bjan-E)-E"
  note: ZI over a bracketed chain, the bracket exposes its item

- text: "a zi"
  error: "ZI must be followed by a verb"

- text: "a zi se"
  error: "SI must be followed by a verb"

- text: "mi zi sa zi se duna mo"
  shape: "(a): mi-E > zi sa zi se duna(A)-A > mo-E"
  note: stacked ZI SI pairs, each SI followed by a ZI or the verb

- text: "a zi sa zi"
  error: "ZI must be followed by a verb"

- text: "a zi sa zi se"
  error: "SI must be followed by a verb"

- text: "a bi"
  error: "at least one"
